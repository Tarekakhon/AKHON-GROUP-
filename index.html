<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKHON SHOP | Exclusive Collection</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header { background: #f85606; color: white; text-align: center; padding: 15px; font-size: 22px; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .section-title { background: #333; color: #fff; padding: 12px; margin-top: 10px; text-align: center; font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .daraz-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .daraz-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; transition: 0.3s; }
        .daraz-card img { width: 100%; height: 230px; object-fit: cover; background: #f9f9f9; }
        .info { padding: 10px; flex-grow: 1; }
        .title { font-size: 13px; color: #212121; height: 36px; overflow: hidden; margin-bottom: 5px; font-weight: 600; line-height: 1.4; }
        .price { color: #f85606; font-size: 16px; font-weight: bold; }
        .buy-btn { background: #f85606; color: #fff; border: none; width: 100%; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 0 0 8px 8px; font-size: 14px; text-transform: uppercase; }
        
        /* Modal Style */
        #orderModal { display:none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(3px); }
        .modal-content { background: #fff; margin: 15% auto; padding: 25px; border-radius: 15px; width: 85%; max-width: 380px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content h3 { text-align: center; color: #f85606; margin-top: 0; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .confirm-btn { background: #25D366; color: white; padding: 15px; border: none; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .cancel-btn { margin-top:10px; width:100%; border:none; background:#eee; padding:10px; border-radius:8px; cursor:pointer; font-weight: bold; color: #666; }
    </style>
</head>
<body>

<div class="header">AKHON SHOP</div>

<div class="section-title">Pakistani Three Piece Collection</div>
<div class="daraz-container" id="pakSection"></div>

<div class="section-title">Indian Three Piece Collection</div>
<div class="daraz-container" id="indSection"></div>

<script>
    // Pakistani Files & Varied Prices (140 to 180 AED)
    const pakData = [
        { img: "01_14_7f0d0c15-1ea6-436f-9004-f38be4fef7f1.jpg", price: "145" },
        { img: "01_21_a2924604-3633-4543-a00e-04a886819209.jpg", price: "150" },
        { img: "01_23_09c7d9ef-d6f1-4fe0-bd17-36d1d4a89fce.jpg", price: "155" },
        { img: "Premium3PieceLawnSuit-PakistaniDress-Malbusaat1.jpeg", price: "175" },
        { img: "laiba-am-vol-186-designer-pakistani-3-piece-suit-new-arrivals-0-2023-05-23_15_01_25.jpeg", price: "180" },
        { img: "product-jpeg.jpg", price: "165" },
        { img: "images (11).jpeg", price: "140" },
        { img: "images (12).jpeg", price: "145" },
        { img: "safa-fashion-fab-1144-designer-3-piece-pakistani-suit-new-designs-2-2023-09-18_14_02_50.jpg", price: "170" }
    ];

    // Indian Files & Varied Prices (120 to 160 AED)
    const indData = [
        { img: "3e1d6e027ab3f735ffe48a4462d4f574.jpg", price: "120" },
        { img: "1759157146_L_4.jpg", price: "125" },
        { img: "1759157146_L_1.jpg", price: "130" },
        { img: "1759157146_L_5.jpg", price: "135" },
        { img: "1759157146_L_6.jpg", price: "140" },
        { img: "2025-09-09-68bff18856568.png", price: "145" },
        { img: "9eed34cdc6d0719e1bdf691cbe941c69.jpg_960x960q80.jpg_.webp", price: "120" },
        { img: "15a71d187bd4fc7d79eaa94ab8a1d00b.jpg_960x960q80.jpg_.webp", price: "130" },
        { img: "523c4a262f8c79c5d5e6565ba4352248.jpg_960x960q80.jpg_.webp", price: "150" },
        { img: "324b4ed0182a57adcc33916093b50a3c.jpg_960x960q80.jpg_.webp", price: "160" },
        { img: "3e1d6e027ab3f735ffe48a4462d4f574.jpg", price: "125" }
    ];

    function render(data, id, type) {
        const div = document.getElementById(id);
        data.forEach((item, i) => {
            div.innerHTML += `
                <div class="daraz-card">
                    <img src="${item.img}" alt="${type}">
                    <div class="info">
                        <div class="title">${type} - Model ${i+1}</div>
                        <div class="price">${item.price} AED</div>
                    </div>
                    <button class="buy-btn" onclick="openModal('${type} Model ${i+1}', '${item.price} AED')">Order Now</button>
                </div>`;
        });
    }

    render(pakData, 'pakSection', 'Pakistani Dress');
    render(indData, 'indSection', 'Indian Dress');

    let orderDetails = "";
    function openModal(name, price) {
        orderDetails = name + " (" + price + ")";
        document.getElementById('modalProductName').innerText = "Order: " + name;
        document.getElementById('orderModal').style.display = "block";
    }
    function closeModal() { document.getElementById('orderModal').style.display = "none"; }

    function sendToWhatsApp() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custNumber').value;
        const addr = document.getElementById('custAddress').value;
        if(!name || !phone || !addr) return alert("Please fill all details!");
        
        const msg = `New Order - AKHON SHOP\n------------------\nProduct: ${orderDetails}\nCustomer: ${name}\nPhone: ${phone}\nAddress: ${addr}`;
        window.open(`https://wa.me/971503974296?text=${encodeURIComponent(msg)}`, '_blank');
        closeModal();
    }
</script>

<div id="orderModal">
    <div class="modal-content">
        <h3 id="modalProductName"></h3>
        <input type="text" id="custName" placeholder="Your Full Name">
        <input type="text" id="custNumber" placeholder="Mobile Number">
        <textarea id="custAddress" placeholder="Full Delivery Address (City/Area)"></textarea>
        <button class="confirm-btn" onclick="sendToWhatsApp()">Order on WhatsApp</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>

</body>
</html>
