<script>
    var currentProduct = "";
    var currentPrice = "";

    function openOrderModal(name, price) {
        currentProduct = name;
        currentPrice = price;
        document.getElementById('modalProductName').innerText = name + " (" + price + ")";
        document.getElementById('orderModal').style.display = "block";
    }

    function closeOrderModal() {
        document.getElementById('orderModal').style.display = "none";
    }

    function sendToWhatsApp() {
        var name = document.getElementById('custName').value;
        var phone = document.getElementById('custNumber').value;
        var address = document.getElementById('custAddress').value;
        var whatsappNumber = "971503974296"; 

        if(name == "" || phone == "" || address == "") {
            alert("সব তথ্য পূরণ করুন!");
            return;
        }

        var message = "নতুন অর্ডার - AKHON SHOP\n" +
                      "------------------------\n" +
                      "প্রোডাক্ট: " + currentProduct + "\n" +
                      "দাম: " + currentPrice + "\n" +
                      "কাস্টমার: " + name + "\n" +
                      "মোবাইল: " + phone + "\n" +
                      "ঠিকানা: " + address;

        var url = "https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(message);
        window.open(url, '_blank');
    }
</script>
