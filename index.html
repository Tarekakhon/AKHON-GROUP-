<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKHON SHOP | Exclusive Collection</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header { background: #f85606; color: white; text-align: center; padding: 15px; font-size: 22px; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .section-title { background: #333; color: #fff; padding: 12px; margin-top: 10px; text-align: center; font-size: 18px; font-weight: bold; text-transform: uppercase; }
        .daraz-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .daraz-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; transition: 0.3s; }
        .daraz-card img { width: 100%; height: 230px; object-fit: cover; background: #f9f9f9; }
        .info { padding: 10px; flex-grow: 1; }
        .title { font-size: 13px; color: #212121; height: 36px; overflow: hidden; margin-bottom: 5px; font-weight: 600; line-height: 1.4; }
        .price { color: #f85606; font-size: 16px; font-weight: bold; }
        .buy-btn { background: #f85606; color: #fff; border: none; width: 100%; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 0 0 8px 8px; font-size: 14px; }
        #orderModal { display:none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(3px); }
        .modal-content { background: #fff; margin: 15% auto; padding: 25px; border-radius: 15px; width: 85%; max-width: 380px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .confirm-btn { background: #25D366; color: white; padding: 15px; border: none; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">AKHON SHOP</div>

<div class="section-title">পাকিস্তানি থ্রি পিস কালেকশন</div>
<div class="daraz-container" id="pakSection"></div>

<div class="section-title">ইন্ডিয়ান থ্রি পিস কালেকশন</div>
<div class="daraz-container" id="indSection"></div>

<script>
    // আপনার আপলোড করা পাকিস্তানি ৯টি ছবির নাম
    const pakFiles = [
        "01_14_7f0d0c15-1ea6-436f-9004-f38be4fef7f1.jpg",
        "01_21_a2924604-3633-4543-a00e-04a886819209.jpg",
        "01_23_09c7d9ef-d6f1-4fe0-bd17-36d1d4a89fce.jpg",
        "Premium3PieceLawnSuit-PakistaniDress-Malbusaat1.jpeg",
        "laiba-am-vol-186-designer-pakistani-3-piece-suit-new-arrivals-0-2023-05-23_15_01_25.jpeg",
        "product-jpeg.jpg",
        "images (11).jpeg",
        "images (12).jpeg",
        "safa-fashion-fab-1144-designer-3-piece-pakistani-suit-new-designs-2-2023-09-18_14_02_50.jpg"
    ];

    // আপনার আপলোড করা ইন্ডিয়ান ১১টি ছবির সঠিক নাম (extension সহ)
    const indFiles = [
        "3e1d6e027ab3f735ffe48a4462d4f574.jpg",
        "1759157146_L_4.jpg",
        "1759157146_L_1.jpg",
        "1759157146_L_5.jpg",
        "1759157146_L_6.jpg",
        "2025-09-09-68bff18856568.png",
        "9eed34cdc6d0719e1bdf691cbe941c69.jpg_960x960q80.jpg_.webp",
        "15a71d187bd4fc7d79eaa94ab8a1d00b.jpg_960x960q80.jpg_.webp",
        "523c4a262f8c79c5d5e6565ba4352248.jpg_960x960q80.jpg_.webp",
        "324b4ed0182a57adcc33916093b50a3c.jpg_960x960q80.jpg_.webp",
        "3e1d6e027ab3f735ffe48a4462d4f574.jpg" // এখানে আপনি ১১ নম্বর ছবি হিসেবে আপনার দেওয়া যেকোনো একটি বাড়তি নাম দিতে পারেন
    ];

    function render(files, id, type, price) {
        const div = document.getElementById(id);
        files.forEach((f, i) => {
            div.innerHTML += `
                <div class="daraz-card">
                    <img src="${f}" alt="${type}">
                    <div class="info">
                        <div class="title">${type} - মডেল ${i+1}</div>
                        <div class="price">${price} AED</div>
                    </div>
                    <button class="buy-btn" onclick="openModal('${type} মডেল ${i+1}', '${price} AED')">অর্ডার করুন</button>
                </div>`;
        });
    }

    render(pakFiles, 'pakSection', 'পাকিস্তানি থ্রি পিস', '135');
    render(indFiles, 'indSection', 'ইন্ডিয়ান থ্রি পিস', '125');

    let orderInfo = "";
    function openModal(n, p) {
        orderInfo = n + " (" + p + ")";
        document.getElementById('modalProductName').innerText = n;
        document.getElementById('orderModal').style.display = "block";
    }
    function closeModal() { document.getElementById('orderModal').style.display = "none"; }

    function sendToWhatsApp() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custNumber').value;
        const addr = document.getElementById('custAddress').value;
        if(!name || !phone || !addr) return alert("দয়া করে সব তথ্য দিন");
        const msg = `নতুন অর্ডার - AKHON SHOP\n------------------\nপণ্য: ${orderInfo}\nক্রেতা: ${name}\nফোন: ${phone}\nঠিকানা: ${addr}`;
        window.open(`https://wa.me/971503974296?text=${encodeURIComponent(msg)}`, '_blank');
        closeModal();
    }
</script>

<div id="orderModal">
    <div class="modal-content">
        <h3 id="modalProductName" style="text-align: center; color: #f85606;"></h3>
        <input type="text" id="custName" placeholder="আপনার নাম">
        <input type="text" id="custNumber" placeholder="মোবাইল নম্বর">
        <textarea id="custAddress" placeholder="পুরো ঠিকানা (সিটি ও এলাকা)"></textarea>
        <button class="confirm-btn" onclick="sendToWhatsApp()">WhatsApp-এ অর্ডার দিন</button>
        <button style="margin-top:10px; width:100%; border:none; background:#eee; padding:10px; border-radius:8px; cursor:pointer; font-weight: bold; color: #666;" onclick="closeModal()">বাতিল</button>
    </div>
</div>

</body>
</html>
